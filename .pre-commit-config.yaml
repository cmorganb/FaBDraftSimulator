repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-core
        name: mypy --strict packages/core
        entry: uv run mypy --strict packages/core
        language: system
        pass_filenames: false
        files: ^packages/core/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
