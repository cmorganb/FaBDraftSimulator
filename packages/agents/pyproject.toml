[project]
name = "fabdraft-agents"
version = "0.1.0"
description = "Agent implementations (human, heuristic, LLM) for the draft simulator (placeholder - WP-14+)"
requires-python = ">=3.12"
dependencies = [
    "fabdraft-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabdraft_agents"]
