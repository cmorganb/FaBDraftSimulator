[project]
name = "fabdraft-core"
version = "0.1.0"
description = "Pure, deterministic, offline draft engine core"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabdraft_core"]
