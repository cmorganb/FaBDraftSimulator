[project]
name = "fabdraftsim"
version = "0.1.0"
description = "Flesh and Blood TCG draft simulator (workspace root, not itself a package)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# apps/web has no pyproject.toml yet (no working npm in this environment
# to scaffold it against - see ADR-0001); exclude it from the workspace
# until WP-19 adds one.
exclude = ["apps/web"]

[tool.uv.sources]
fabdraft-core = { workspace = true }
fabdraft-agents = { workspace = true }
fabdraft-exports = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "datamodel-code-generator>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "scripts"]
extend-exclude = ["**/contracts/generated", "*.md", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/contracts/generated/*.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["contracts/generated"]
explicit_package_bases = true
mypy_path = ["packages/core", "packages/agents", "packages/exports"]
# Once WP-03 generates fabdraft_core.contracts.generated.*, add a
# [[tool.mypy.overrides]] block for it (generated code, not hand-checked).

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/agents/tests",
    "packages/exports/tests",
    "scripts/tests",
]
# importlib import mode: multiple packages each have their own tests/
# directory, so basenames like test_placeholder.py are not unique repo-wide.
# pythonpath makes `import scripts.ingest_set` etc. resolve regardless of
# how pytest is invoked.
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["fabdraft_core"]
branch = true

[tool.coverage.report]
skip_empty = true
